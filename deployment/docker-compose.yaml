services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: smartfind_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:6
    ports:
      - "6379:6379"
volumes:
  db_data: