services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: smartfind_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:6
    ports:
      - "6379:6379"
  django: &django
    image: smart_find_django
    build:
      context: ${GITHUB_WORKSPACE:-..}
      dockerfile: deployment/django.Dockerfile
    ports:
      - "8000:8000"
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py create_default_db_objects &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ${GITHUB_WORKSPACE:-..}:/app:z
    working_dir: /app
    depends_on:
      - postgres
      - redis

  flower:
    <<: *django
    command: celery -A smartfindAPI flower
    ports:
      - "5555:5555"
  worker:
    <<: *django
    command: celery -A smartfindAPI worker -l info
    ports: [ ]
  beat:
    <<: *django
    command: celery -A smartfindAPI beat -l info
    ports: [ ]
volumes:
  db_data:
