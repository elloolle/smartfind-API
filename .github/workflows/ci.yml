name: ci

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache local backend
        uses: docker/bake-action@v6
        with:
          push: false
          load: true
          files: deployment/docker-compose.yml
          targets: django
          set: |
            django.cache-from=type=gha,scope=django-cached-tests
            django.cache-to=type=gha,scope=django-cached-tests,mode=max

      - name: Check DB Migrations
        run: docker compose -f deployment/docker-compose.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f deployment/docker-compose.yml run --rm django python manage.py migrate

      - name: Run Django Tests
        run: docker compose -f deployment/docker-compose.yml run --rm django python manage.py test

      - name: Tear down the Stack
        run: docker compose -f deployment/docker-compose.yml down
