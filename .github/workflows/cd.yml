name: deployment

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE }}
  DB_HOST: ${{ vars.POSTGRES_HOST }}
on:
  workflow_run:
    workflows: [ci]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-push-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: levkul
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache docker compose
        uses: docker/bake-action@v6
        with:
          push: true
          load: false
          files: deployment/docker-compose.yml
          set: |
            django.cache-from=type=gha,scope=deploy-django-cache
            django.cache-to=type=gha,scope=deploy-django-cache,mode=max

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: TEST
    needs:
      - build-and-push-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Stack deploy
        uses: serversideup/github-action-docker-swarm-deploy@v3
        with:
          docker_compose_file_path: -c deployment/docker-compose.yml
          ssh_deploy_user: root
          ssh_deploy_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_remote_hostname: 31.192.110.152
          registry-username: levkul
          registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
          stack_name: fuel-tracker